; RC003 → ESP32-C6 BLE 桥（阶段 1：诊断固件 + 机器可读协议）
;
; 板子实测：ESP32-C6FH8 (QFN32) rev v0.2 / 8MB 封装内 flash / USB-Serial-JTAG
; 注意：C6 没有 USB-OTG 外设，USB 口只能做 CDC 串口，不能做 HID 键盘。
;       这正好让 COM3 全程保留，刷写随时可做。
;
; ---------------------------------------------------------------------------
; 为什么 platform 不是官方的 `espressif32` 而是 pioarduino
; ---------------------------------------------------------------------------
; 官方 platformio/espressif32 最新只到 7.1.2，它封装的 Arduino 内核是
; arduino-esp32 **2.0.17**（`framework-arduinoespressif32` 的版本号最高就是
; `4.20017.*`）。而 ESP32-C6 是 arduino-esp32 **3.0** 才加入的芯片 —— 所以
; 官方平台上 `esp32-c6-devkitc-1` 这块板的定义里写的是：
;
;     "frameworks": ["espidf"]     ← 只有 IDF，没有 arduino
;
; 也就是说 `board = esp32-c6-devkitc-1` + `framework = arduino` 在官方平台上
; 是**非法组合**，报错会是 "This board does not support arduino framework"。
;
; pioarduino 是社区维护的 espressif32 分支，跟进 arduino-esp32 3.x，C6/C3/H2/P4
; 的 arduino 框架都在里面。这里钉死具体版本号，避免上游更新导致构建漂移。
; 升版本时同时确认 [env] 里的 build_flags 仍然适用。

[env:esp32-c6-devkitc-1]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = esp32-c6-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed  = 460800

; 端口**故意不写死**。PlatformIO 在没有 upload_port 时自己枚举可用串口：
; 只有一个就直接用，有多个才让你挑。写死 COM3 在别的机器上就是错的 ——
; 每台机器给 USB-Serial/JTAG 分的号不一样。
;
; 要钉死某一个口，临时在命令行加：-t upload --upload-port COM7
; （别改这个文件：写死之后换机器又得改回来。）
; monitor_port 同理，用 platformio device monitor --port COM7。

board_upload.flash_size = 8MB
board_build.flash_size  = 8MB
board_build.partitions  = default_8MB.csv

; NimBLE-Arduino 必须显式声明。arduino-esp32 3.x **不再内置**它了 ——
; framework-arduinoespressif32/libraries/ 里只有 Bluedroid 那套（BLE/、
; SimpleBLE/），没有 NimBLEDevice.h。不写这一行就是编译期
; "fatal error: NimBLEDevice.h: No such file or directory"。
;
; 选 NimBLE 而不是内置的 Bluedroid：这个固件是 BLE **central**，要同时挂
; HID 和电量两条链路，NimBLE 的 flash/RAM 占用小得多。
; 2.x 对应 ESP-IDF 5.x 的 NimBLE host，正是 arduino-esp32 3.3.11 带的那版。
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; 不要在这里定义 -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS：它已经在
    ; framework-arduinoespressif32-libs/esp32c6/*/include/sdkconfig.h 里了，
    ; 重复定义只会产生一堆 "redefined" 警告，而且 sdkconfig.h 的定义在后面，
    ; 命令行那个根本不起作用。

monitor_filters = time, colorize, direct
monitor_rts = 0
monitor_dtr = 0
